name: CI/CD Backend Pipeline

# ==============================================================================
# 1. Gatilhos de Execução (Triggers)
# ==============================================================================
on:
  push:
    branches:
      - main # Roda sempre que houver um push na branch main
  pull_request:
    branches:
      - main # Roda quando um Pull Request é aberto ou atualizado para a branch main

jobs:
  # ============================================================================
  # 1. CONTINUOUS INTEGRATION (CI) - BUILD, TESTES E ARTEFATOS
  # ============================================================================
  build-and-test:
    name: 🏗️ Compilação, Testes e Geração de Artefatos
    runs-on: ubuntu-latest

    # Banco de dados MariaDB para testes de integração com o banco
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_DATABASE: auto_prime
          MYSQL_ROOT_PASSWORD: fabio123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: ☕ Configurar ambiente Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🐳 Configurar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Instalação das Dependências (Maven)
        working-directory: "./Auto Prime/app"
        run: |
          echo "Baixando e instalando todas as dependências do projeto..."
          chmod +x mvnw
          ./mvnw dependency:resolve

      - name: ⚙️ Compilação da Aplicação
        working-directory: "./Auto Prime/app"
        run: |
          echo "Compilando o código fonte da aplicação..."
          ./mvnw compile

      - name: 🧪 Execução de Testes Unitários e Automatizados
        working-directory: "./Auto Prime/app"
        env:
          SPRING_DATASOURCE_URL: jdbc:mariadb://127.0.0.1:3307/auto_prime
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: fabio123
          JWT_SECRET: AUDI_KEY
          JWT_EXPIRATION: 3600000
        run: |
          echo "Executando testes unitários, automatizados e validando conexão com banco..."
          ./mvnw test

      - name: 📦 Geração do Artefato Executável (.jar)
        working-directory: "./Auto Prime/app"
        run: |
          echo "Gerando pacote JAR da aplicação..."
          ./mvnw package -DskipTests

      - name: 📤 Upload do Artefato da Aplicação (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: autoprime-backend-jar
          path: "./Auto Prime/app/target/*.jar"
          retention-days: 7

      - name: 🛠️ Build e Validação da Imagem Docker
        run: |
          echo "Iniciando a construção e validação da imagem Docker..."
          docker build -t autoprime-backend:latest "./Auto Prime/app"

  # ============================================================================
  # 2. CONTINUOUS DEPLOYMENT (CD) - ENTREGA DIRETA NA VM ALPINE LINUX
  # ============================================================================
  deploy-cd:
    name: 🚀 Deploy Direto (CD) na VM Alpine Linux
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🐳 Configurar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------------
      # PASSO 1: Publicar a Imagem (Push) no Container Registry (GHCR)
      # ------------------------------------------------------------------------
      - name: 🔑 Autenticação no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Definir Tags e Rótulos da Imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/autoprime-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 📤 Build e Push da Imagem para o Registry (GHCR)
        uses: docker/build-push-action@v5
        with:
          context: "./Auto Prime/app"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ------------------------------------------------------------------------
      # PASSO 2 & 3: Conectar na VM via SSH, Atualizar e Rodar o Container
      # ------------------------------------------------------------------------
      - name: 🌐 Conectar na VM via SSH e Executar Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            echo "========================================="
            echo "🚀 Iniciando Deploy Automatizado na VM Alpine"
            echo "========================================="

            IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/autoprime-backend:latest"

            # 1. Login no registro a partir da VM
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Baixar a imagem nova do registro (Pull)
            echo "📦 Efetuando docker pull da imagem: $IMAGE_NAME"
            docker pull $IMAGE_NAME

            # 3. Injetar o arquivo .env com as variáveis de produção
            echo "🔐 Gerando arquivo .env de produção..."
            cat << 'EOF' > .env
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL || 'jdbc:mariadb://127.0.0.1:3307/auto_prime' }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME || 'root' }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD || 'fabio123' }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD || 'fabio123' }}
            JWT_SECRET=${{ secrets.JWT_SECRET || 'AUDI_KEY' }}
            JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION || '3600000' }}
            EOF

            # 4. Parar e remover container antigo
            echo "🛑 Parando container antigo..."
            docker stop autoprime-backend || true
            docker rm autoprime-backend || true

            # 5. Subir a versão atualizada (Docker Run)
            echo "▶️ Executando docker run da versão atualizada..."
            docker run -d \
              --name autoprime-backend \
              --restart always \
              -p 8080:8080 \
              --env-file .env \
              $IMAGE_NAME

            # 6. Limpeza de imagens antigas
            echo "🧹 Limpando imagens antigas..."
            docker image prune -f

            echo "✅ Deploy de Continuous Deployment (CD) finalizado com sucesso!"