spring.application.name=Prime
spring.config.import=optional:file:./.env[.properties]

## MariaDB configs
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/auto_prime?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:fabio123}}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

## JPA configs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

## JWT configs
jwt.secret=${JWT_SECRET:${api.security.token.secret:AUDI_KEY}}
jwt.expiration=${JWT_EXPIRATION:3600000}
